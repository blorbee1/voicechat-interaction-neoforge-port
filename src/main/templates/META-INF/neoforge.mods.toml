license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}" #mandatory
logoFile="icon.png"
authors="blorbee"
description='''
Unofficial NeoForge port of the Voice Chat Interaction mod
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="voicechat"
    type="required"
    versionRange="[${voicechat_mod_version}]"
    ordering="AFTER"
    side="BOTH"
